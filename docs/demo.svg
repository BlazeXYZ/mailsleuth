l="#ff5f57"/><circle cx="40" cy="15" r="6" fill="#febc2e"/><circle cx="60" cy="15" r="6" fill="#28c840"/><text x="434" y="19.5" text-anchor="middle" style="font-size:12px;opacity:.65">MailSleuth</text><defs><g id="a"><text x="0" y="14.14" class="f0" textLength="100.8">~/mailsleuth</text><text x="109.2" y="14.14" class="f1" textLength="8.4">❯</text></g><g id="b"><use href="#a"/><text x="117.6" y="14.14" textLength="25.2"> py</text></g><g id="c"><use href="#b"/><text x="142.8" y="14.14" textLength="16.8">th</text></g><g id="d"><use href="#c"/><text x="159.6" y="14.14" textLength="8.4">o</text></g><g id="e"><use href="#d"/><text x="168" y="14.14" textLength="8.4">n</text></g><g id="f"><use href="#e"/><text x="176.4" y="14.14" textLength="25.2"> -m</text></g><g id="g"><use href="#f"/><text x="201.6" y="14.14" textLength="16.8"> m</text></g><g id="h"><use href="#g"/><text x="218.4" y="14.14" textLength="8.4">a</text></g><g id="i"><use href="#h"/><text x="226.8" y="14.14" textLength="8.4">i</text></g><g id="j"><use href="#i"/><text x="235.2" y="14.14" textLength="16.8">ls</text></g><g id="k"><use href="#j"/><text x="252" y="14.14" textLength="8.4">l</text></g><g id="l"><use href="#k"/><text x="260.4" y="14.14" textLength="8.4">e</text></g><g id="m"><use href="#l"/><text x="268.8" y="14.14" textLength="8.4">u</text></g><g id="n"><use href="#m"/><text x="277.2" y="14.14" textLength="8.4">t</text></g><g id="o"><use href="#n"/><text x="285.6" y="14.14" textLength="8.4">h</text></g><g id="p"><use href="#o"/><text x="294" y="14.14" textLength="16.8"> s</text></g><g id="q"><use href="#p"/><text x="310.8" y="14.14" textLength="16.8">am</text></g><g id="r"><use href="#q"/><text x="327.6" y="14.14" textLength="16.8">pl</text></g><g id="s"><use href="#r"/><text x="344.4" y="14.14" textLength="8.4">e</text></g><g id="t"><use href="#s"/><text x="352.8" y="14.14" textLength="16.8">s/</text></g><g id="u"><use href="#t"/><text x="369.6" y="14.14" textLength="8.4">0</text></g><g id="v"><use href="#u"/><text x="378" y="14.14" textLength="8.4">3</text></g><g id="w"><use href="#v"/><text x="386.4" y="14.14" textLength="8.4">_</text></g><g id="x"><use href="#w"/><text x="394.8" y="14.14" textLength="16.8">be</text></g><g id="y"><use href="#x"/><text x="411.6" y="14.14" textLength="16.8">c_</text></g><g id="z"><use href="#y"/><text x="428.4" y="14.14" textLength="8.4">i</text></g><g id="ba"><use href="#z"/><text x="436.8" y="14.14" textLength="8.4">n</text></g><g id="bb"><use href="#ba"/><text x="445.2" y="14.14" textLength="8.4">v</text></g><g id="bc"><use href="#bb"/><text x="453.6" y="14.14" textLength="8.4">o</text></g><g id="bd"><use href="#bc"/><text x="462" y="14.14" textLength="16.8">ic</text></g><g id="be"><use href="#bd"/><text x="478.8" y="14.14" textLength="8.4">e</text></g><g id="bf"><use href="#be"/><text x="487.2" y="14.14" textLength="16.8">.e</text></g><g id="bg"><use href="#bf"/><text x="504" y="14.14" textLength="8.4">m</text></g><g id="bh"><use href="#bg"/><text x="512.4" y="14.14" textLength="8.4">l</text></g><g id="bi"><text x="0" y="14.14" class="f2" textLength="604.8">────────────────────────────────────────────────────────────────────────</text></g><g id="bj"><text x="0" y="14.14" class="f3" textLength="84">MailSleuth</text><text x="84" y="14.14" textLength="235.2">  samples/03_bec_invoice.eml</text></g><g id="bk"><text x="0" y="14.14" class="f4" textLength="126">LIKELY PHISHING</text><text x="126" y="14.14" textLength="159.6">  risk score 79/100</text></g><g id="bl"><text x="0" y="14.14" textLength="588">This email is very likely phishing: replies are secretly redirected to</text></g><g id="bm"><text x="0" y="14.14" textLength="537.6">dana.whitfield.ceo@gmail.com; acmec0rp.com is a lookalike of the</text></g><g id="bn"><text x="0" y="14.14" textLength="462">recipient's own domain acmecorp.com; and the attachment</text></g><g id="bo"><text x="0" y="14.14" textLength="604.8">Invoice_88213.pdf.html disguises its real file type. It passes SPF, DKIM</text></g><g id="bp"><text x="0" y="14.14" textLength="588">and DMARC, which means the attacker controls the sending domain rather</text></g><g id="bq"><text x="0" y="14.14" textLength="243.6">than spoofing someone else's.</text></g><g id="br"><text x="0" y="14.14" class="f2" textLength="378">Points: Sender 50 · Attachment 25 · Content 4</text></g><g id="bs"><text x="0" y="14.14" textLength="554.4">  Subject      Overdue vendor invoice - wire transfer needed today</text></g><g id="bt"><text x="0" y="14.14" textLength="495.6">  From         Dana Whitfield &lt;dana.whitfield@acmec0rp.com&gt;</text></g><g id="bu"><text x="0" y="14.14" textLength="352.8">  Return-Path  dana.whitfield@acmec0rp.com</text></g><g id="bv"><text x="0" y="14.14" textLength="361.2">  Reply-To     dana.whitfield.ceo@gmail.com</text></g><g id="bw"><text x="0" y="14.14" textLength="294">  To           ap-team@acmecorp.com</text></g><g id="bx"><text x="0" y="14.14" textLength="386.4">  Date         Mon, 02 Nov 2026 16:12:35 +0000</text></g><g id="by"><text x="0" y="14.14" textLength="226.8">  Origin IP    203.0.113.99</text></g><g id="bz"><text x="0" y="14.14" textLength="151.2">  Auth         SPF</text><text x="159.6" y="14.14" class="f5" textLength="33.6">pass</text><text x="193.2" y="14.14" textLength="58.8">   DKIM</text><text x="260.4" y="14.14" class="f5" textLength="33.6">pass</text><text x="294" y="14.14" textLength="67.2">   DMARC</text><text x="369.6" y="14.14" class="f5" textLength="33.6">pass</text></g><g id="ca"><text x="0" y="14.14" class="f3" textLength="100.8">Findings (4)</text></g><g id="cb"><text x="16.8" y="14.14" class="f6" textLength="33.6">HIGH</text><text x="75.6" y="14.14" textLength="378"> Replies redirected to a free webmail account</text><text x="470.4" y="14.14" class="f2" textLength="151.2">[T1566, T1585.002]</text></g><g id="cc"><text x="84" y="14.14" class="f2" textLength="756">Reply-To is dana.whitfield.ceo@gmail.com while From is dana.whitfield@acmec0rp.com. This i</text></g><g id="cd"><text x="0" y="14.14" class="f2" textLength="403.2">s a hallmark of business email compromise (BEC).</text></g><g id="ce"><text x="16.8" y="14.14" class="f6" textLength="33.6">HIGH</text><text x="75.6" y="14.14" textLength="436.8"> Sender domain imitates the recipient's organization</text><text x="529.2" y="14.14" class="f2" textLength="151.2">[T1583.001, T1656]</text></g><g id="cf"><text x="84" y="14.14" class="f2" textLength="747.6">acmec0rp.com is a near-copy of acmecorp.com. Attackers register these 'cousin domains' to</text></g><g id="cg"><text x="0" y="14.14" class="f2" textLength="151.2">pose as coworkers.</text></g><g id="ch"><text x="16.8" y="14.14" class="f6" textLength="33.6">HIGH</text><text x="75.6" y="14.14" textLength="386.4"> Double file extension: Invoice_88213.pdf.html</text><text x="478.8" y="14.14" class="f2" textLength="184.8">[T1566.001, T1036.007]</text></g><g id="ci"><text x="84" y="14.14" class="f2" textLength="546">The real file type is hidden behind a harmless-looking extension.</text></g><g id="cj"><text x="16.8" y="14.14" class="f7" textLength="25.2">LOW</text><text x="75.6" y="14.14" textLength="235.2"> Urgency / pressure language</text></g><g id="ck"><text x="84" y="14.14" class="f2" textLength="327.6">Matched: 'immediately', 'wire transfer'</text></g><g id="cl"><text x="0" y="14.14" class="f2" textLength="126">… 18 more lines</text></g></defs><svg x="14" y="44" width="840" height="637"><g class="s"><g transform="translate(0 0)"></g><g transform="translate(0 637)"><use href="#a" y="0"/></g><g transform="translate(0 1274)"><use href="#b" y="0"/></g><g transform="translate(0 1911)"><use href="#c" y="0"/></g><g transform="translate(0 2548)"><use href="#d" y="0"/></g><g transform="translate(0 3185)"><use href="#e" y="0"/></g><g transform="translate(0 3822)"><use href="#f" y="0"/></g><g transform="translate(0 4459)"><use href="#g" y="0"/></g><g transform="translate(0 5096)"><use href="#h" y="0"/></g><g